# Shared defaults for YAML-launched TTT-Discover runs.
# Relative paths are resolved from the repository root.
defaults:
  backend: cli
  eval_runner: auto
  max_output_tokens: 8192
  max_concurrent_requests: 4
  num_cpus_per_task: 1
  wandb_project: ""

runs:
  cap_set_discovery:
    env_type: examples.cap_set_priority.env:CapSetPriorityEnv
    problem_type: "8"
    experiment_name: cap-set-priority-repro
    wandb_project: cap-set-priority
    algorithm: ttt_discover
    num_epochs: 10
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 45

  cap_set_autoevolve:
    env_type: examples.cap_set_priority.env:CapSetPriorityEnv
    problem_type: "8"
    experiment_name: capset-codex-experimental
    algorithm: autoevolve
    eval_runner: in_process
    backend: cli
    cli_sandbox: workspace-write
    max_concurrent_requests: null
    num_epochs: 10
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 45

  erdos_discovery:
    env_type: examples.erdos_min_overlap.env:ErdosMinOverlapEnv
    problem_type: ""
    experiment_name: erdos-min-overlap-repro
    wandb_project: erdos-min-overlap
    algorithm: ttt_discover
    num_epochs: 50
    group_size: 64
    groups_per_batch: 8
    eval_timeout: 1100

  erdos_codex:
    env_type: examples.erdos_min_overlap.env:ErdosMinOverlapEnv
    problem_type: ""
    experiment_name: erdos-codex-experimental
    algorithm: ttt_discover
    eval_runner: in_process
    model_name: gpt-5.5
    num_epochs: 50
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 500
    max_concurrent_requests: 1
    remove_constant_reward_groups: false

  kakeya_discovery:
    env_type: examples.kakeya.env:KakeyaEnv
    problem_type: "3:5,7,13"
    experiment_name: kakeya-repro
    wandb_project: kakeya
    algorithm: ttt_discover
    num_epochs: 10
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 120

  ahc039:
    env_type: examples.ahc.env:AhcEnv
    problem_type: ahc039
    experiment_name: ahc039-codex
    algorithm: ttt_discover
    num_epochs: 10
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 530

  ahc058:
    env_type: examples.ahc.env:AhcEnv
    problem_type: ahc058
    experiment_name: ahc058-codex
    algorithm: ttt_discover
    num_epochs: 10
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 530

  gpu_mode_trimul:
    env_type: examples.gpu_mode.env:GpuModeEnv
    problem_type: trimul
    experiment_name: gpu-mode-trimul
    algorithm: ttt_discover
    num_epochs: 50
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 1200
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      PYTHONUNBUFFERED: "1"

  gpu_mode_mla_decode_nvidia:
    env_type: examples.gpu_mode.env:GpuModeEnv
    problem_type: mla_decode_nvidia
    experiment_name: gpu-mode-mla-decode-nvidia
    algorithm: ttt_discover
    num_epochs: 50
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 1200
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      PYTHONUNBUFFERED: "1"

  aicrowd_whestbench:
    env_type: examples.aicrowd_whestbench.env:WhestBenchEnv
    problem_type: arc_whestbench_2026
    experiment_name: aicrowd-whestbench
    algorithm: ttt_discover
    eval_runner: in_process
    num_epochs: 50
    group_size: 1
    groups_per_batch: 1
    eval_timeout: 300
    wandb_project: whestbench
    env:
      PYTHONUNBUFFERED: "1"
      WHEST_LOCAL_WIDTH: "64"
      WHEST_LOCAL_DEPTH: "8"
      WHEST_LOCAL_REFERENCE_SAMPLES: "4096"
      WHEST_LOCAL_SEEDS: "0,1,2"
