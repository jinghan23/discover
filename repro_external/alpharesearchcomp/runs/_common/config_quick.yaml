max_iterations: 5
checkpoint_interval: 1
log_level: "INFO"
random_seed: 0

diff_based_evolution: true
allow_full_rewrites: false
max_code_length: 100000

llm:
  api_base: "https://api.openai.com/v1"
  api_key: null
  models:
    - name: "gpt-4o-mini"
      weight: 1.0
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096
  timeout: 300
  retries: 3
  retry_delay: 5

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true

database:
  in_memory: true
  log_prompts: true
  population_size: 100
  archive_size: 20
  num_islands: 3
  migration_interval: 10
  migration_rate: 0.1
  elite_selection_ratio: 0.1
  exploration_ratio: 0.2
  exploitation_ratio: 0.7
  feature_dimensions:
    - "score"
    - "complexity"
  feature_bins: 10

evaluator:
  timeout: 300
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false

rewardmodel:
  model_type: "api"
  model_name: "gpt-4o-mini"
  api_key: null
  base_url: "https://api.openai.com/v1"
  jsonl_file: "reward_results.jsonl"
  proposal_score_threshold: 0.0
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1000
  max_retries: 3
  retry_delay: 2
